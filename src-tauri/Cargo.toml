[package]
name = "transpose"
version = "0.6.0"
description = "A small native translation companion"
authors = ["Ryan"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
futures-util = "0.3"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1"
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.15"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "fs", "macros", "rt"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
