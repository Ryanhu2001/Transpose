name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Verify and build · Apple Silicon
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Check toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          node --version
          npm --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          IFS=. read -r sdk_major sdk_minor _ <<< "$sdk_version"
          if (( sdk_major < 26 || (sdk_major == 26 && sdk_minor < 4) )); then
            echo "macOS SDK 26.4 or newer is required; found $sdk_version" >&2
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Run offline verification
        run: ./verify.sh

      - name: Build app bundle
        run: ./build.sh
