name: Bug report / 问题反馈
description: Report a reproducible problem with Transpose.
body:
  - type: markdown
    attributes:
      value: Please remove API keys, private text, and personal information from screenshots and logs.
  - type: input
    id: version
    attributes:
      label: Transpose version / 版本
      placeholder: 0.7.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture / 系统与架构
      placeholder: macOS 26.4, Apple M2 / Windows 11, x64
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Translation service / 翻译服务
      placeholder: Apple Translation, DeepSeek, OpenRouter, or CLI name and version
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the source app and whether you used text selection or screen capture.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots or additional details / 截图或补充信息
